<svg fill="none" viewBox="0 0 800 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&amp;family=Fira+Code:wght@500;700&amp;display=swap');

    .bg {
      fill: #0b0f19;
    }
    .title {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#text-gradient);
    }
    .subtitle {
      font-family: 'Fira Code', monospace;
      font-weight: 500;
      font-size: 17px;
      fill: #a5f3fc;
      letter-spacing: 1px;
    }
    .tag {
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #34d399;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
  </style>

  <defs>
    <!-- Background Radial Glows -->
    <radialGradient id="glow-left" cx="10%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="90%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="240" rx="16" class="bg" />

  <!-- Ambient Glows -->
  <rect width="800" height="240" rx="16" fill="url(#glow-left)" />
  <rect width="800" height="240" rx="16" fill="url(#glow-right)" />
  <rect width="800" height="240" rx="16" fill="url(#glow-center)" />

  <!-- Cyber Grid Lines -->
  <path d="M0 40 L800 40 M0 80 L800 80 M0 120 L800 120 M0 160 L800 160 M0 200 L800 200" class="grid-line" />
  <path d="M100 0 L100 240 M200 0 L200 240 M300 0 L300 240 M400 0 L400 240 M500 0 L500 240 M600 0 L600 240 M700 0 L700 240" class="grid-line" />

  <!-- Card Border -->
  <rect x="1.5" y="1.5" width="797" height="237" rx="14.5" fill="none" stroke="url(#border-gradient)" stroke-width="3" />

  <!-- Content Group -->
  <g filter="url(#shadow)">
    <!-- Main Name -->
    <text x="400" y="95" text-anchor="middle" class="title">AADARSH PRATAP</text>
    
    <!-- Subtitle -->
    <text x="400" y="140" text-anchor="middle" class="subtitle">&lt; Full Stack Developer &#183; AI Engineer &gt;</text>
  </g>

  <!-- Tech Pills Bar -->
  <g transform="translate(140, 175)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="95" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="47.5" y="18" text-anchor="middle" class="tag" fill="#38bdf8">&#9889; Java</text>

    <!-- Pill 2 -->
    <rect x="105" y="0" width="85" height="28" rx="14" fill="#0f172a" stroke="#00add8" stroke-width="1.5" />
    <text x="147.5" y="18" text-anchor="middle" class="tag" fill="#00add8">&#128640; Go</text>

    <!-- Pill 3 -->
    <rect x="200" y="0" width="95" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="247.5" y="18" text-anchor="middle" class="tag" fill="#34d399">&#128013; Python</text>

    <!-- Pill 4 -->
    <rect x="305" y="0" width="100" height="28" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
    <text x="355" y="18" text-anchor="middle" class="tag" fill="#f472b6">&#128187; Node.js</text>

    <!-- Pill 5 -->
    <rect x="415" y="0" width="85" height="28" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <text x="457.5" y="18" text-anchor="middle" class="tag" fill="#fbbf24">&#128452; SQL</text>
  </g>
</svg>
